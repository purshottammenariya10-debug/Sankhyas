name: Update data and deploy

# Fetches every Indian listed company from Yahoo Finance, plus NSE/BSE filings, then
# publishes the site with that data to the gh-pages branch, which GitHub Pages serves.
# Data is kept between runs in the Actions cache, and gh-pages is rewritten as a single
# commit each time, so the repository does not grow.
#
# GitHub turns Pages on automatically when gh-pages is first pushed; if it does not,
# set Settings -> Pages -> Source: "Deploy from a branch", branch gh-pages, folder / (root).

on:
  schedule:
    # 11:30 UTC = 5:00 pm IST, after market close, Monday to Friday: full update (prices, financials, filings)
    - cron: "30 11 * * 1-5"
    # every 2 hours, every day: filings only (concall transcripts, presentations, recordings, results,
    # board meetings) and their AI summaries. NSE's feeds only hold the last day or so, so frequent
    # sweeps are what catch every document.
    - cron: "17 */2 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      max_full:
        description: "Companies to fully refresh from Yahoo this run (the rest get today's price)"
        required: false
        default: "1200"
      max_backfill:
        description: "Companies whose filing history to backfill this run"
        required: false
        default: "150"

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    # Set the repository variable DATA_RUNNER to "self-hosted" to run on your own machine in India
    # (NSE and BSE block GitHub's servers). See scripts/setup-india-runner.sh and the README.
    runs-on: ${{ vars.DATA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: sankhyas-data-${{ github.run_id }}
          restore-keys: sankhyas-data-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python packages
        run: pip install yfinance requests pypdf

      - name: Company list (NSE + BSE)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 11 * * 1-5'
        continue-on-error: true
        run: python scripts/fetch_universe.py

      - name: Yahoo Finance data
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 11 * * 1-5'
        continue-on-error: true
        run: python scripts/fetch_yahoo.py --universe --max-full "${{ github.event.inputs.max_full || '1200' }}" --delay 0.5

      - name: NSE/BSE filings
        if: github.event_name != 'push'
        continue-on-error: true
        # NSE refuses GitHub's servers, so NSE history comes through the nse-proxy Edge Function
        # (Supabase, Mumbai). Every run backfills 3 years of filings (concalls, PPTs, annual
        # reports) for the next batch of companies until all NSE companies are covered.
        run: python scripts/fetch_filings.py --max-backfill "${{ github.event.schedule == '17 */2 * * *' && '80' || github.event.inputs.max_backfill || '300' }}"

      - name: Shareholding pattern and quarterly results (NSE)
        if: github.event_name != 'push'
        continue-on-error: true
        # quarterly shareholding (promoter / FII / DII / public / pledge) and results for the verdict
        # cards; companies that just filed results are refreshed first
        run: python scripts/fetch_nse_extra.py --max-results "${{ github.event.schedule == '17 */2 * * *' && '150' || '400' }}" --max-shp "${{ github.event.schedule == '17 */2 * * *' && '120' || '300' }}" --max-shp-xbrl "${{ github.event.schedule == '17 */2 * * *' && '300' || '900' }}"

      - name: IPOs and rights issues (NSE)
        run: python scripts/fetch_ipo.py || echo "IPO data not refreshed"
      - name: IPO research notes (red herring prospectus digests)
        continue-on-error: true
        timeout-minutes: 20
        run: python scripts/ipo_notes.py --max "${{ github.event.schedule == '17 */2 * * *' && '4' || '10' }}" || echo "IPO notes not refreshed"
      - name: Bulk and block deals (NSE daily files)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/fetch_deals.py

      - name: Concall summaries (free, rule-based)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/summarize_concalls.py --max "${{ github.event.schedule == '17 */2 * * *' && '100' || '250' }}" --max-ar "${{ github.event.schedule == '17 */2 * * *' && '25' || '80' }}"  --max-ratings "${{ github.event.schedule == '17 */2 * * *' && '200' || '500' }}"

      - name: Ten-year financial history (NSE annual results, merged before Yahoo's four years)
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/fetch_history.py --max "${{ github.event.schedule == '17 */2 * * *' && '25' || '60' }}" || python scripts/fetch_history.py --merge-only || echo "history not merged"

      - name: Build company index
        run: |
          if ls data/yahoo/*.json >/dev/null 2>&1; then node scripts/build_index.mjs; else echo "No Yahoo data yet; the site will use sample data"; fi

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: sankhyas-data-${{ github.run_id }}

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js assets _site/
          mkdir -p _site/data
          [ -d data/yahoo ] && cp -r data/yahoo _site/data/ || true
          [ -d data/filings ] && cp -r data/filings _site/data/ || true
          [ -d data/shp ] && cp -r data/shp _site/data/ || true
          [ -d data/results ] && cp -r data/results _site/data/ || true
          du -sh _site

      # Accounts and payments: public keys come from repository variables (Settings > Secrets and
      # variables > Actions > Variables). Without SUPABASE_URL the site runs without real accounts.
      - name: Site settings (accounts and payments)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          RAZORPAY_KEY_ID: ${{ vars.RAZORPAY_KEY_ID }}
          PRO_FREE_DURING_BETA: ${{ vars.PRO_FREE_DURING_BETA }}
          BUSINESS_NAME: ${{ vars.BUSINESS_NAME }}
          BUSINESS_EMAIL: ${{ vars.BUSINESS_EMAIL }}
          BUSINESS_INSTAGRAM: ${{ vars.BUSINESS_INSTAGRAM }}
          BUSINESS_PHONE: ${{ vars.BUSINESS_PHONE }}
          BUSINESS_ADDRESS: ${{ vars.BUSINESS_ADDRESS }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            node -e '
              const e = process.env, s = v => JSON.stringify(v || "");
              const cfg = { supabaseUrl: e.SUPABASE_URL, supabaseAnonKey: e.SUPABASE_ANON_KEY, razorpayKeyId: e.RAZORPAY_KEY_ID,
                proFreeDuringBeta: /^(1|true|yes)$/i.test(e.PRO_FREE_DURING_BETA || ""),
                business: { name: e.BUSINESS_NAME || "Sankhyas", email: e.BUSINESS_EMAIL || "connect@sankhyas.com", phone: e.BUSINESS_PHONE || "", address: e.BUSINESS_ADDRESS || "", instagram: e.BUSINESS_INSTAGRAM || "sankhyas.co" } };
              require("fs").writeFileSync("_site/js/config.js", "window.SANKHYAS_CONFIG = " + JSON.stringify(cfg, null, 2) + ";\n");
            '
            echo "Accounts and payments: on ($SUPABASE_URL)"
          else
            echo "Accounts and payments: off (set the SUPABASE_URL repository variable to switch them on)"
          fi

      # Custom domain (default sankhyas.com; set the CUSTOM_DOMAIN repository variable to change it,
      # or to "none" to turn it off). The domain is switched on only once its DNS points at GitHub
      # Pages, so the site never redirects to a domain that does not reach it yet. Behind a proxy
      # such as Cloudflare's orange cloud, set CUSTOM_DOMAIN_FORCE=1 instead.
      - name: Custom domain and search-engine pages
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || 'sankhyas.com' }}
          CUSTOM_DOMAIN_FORCE: ${{ vars.CUSTOM_DOMAIN_FORCE }}
        run: |
          ORIGIN="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          if [ "$CUSTOM_DOMAIN" != "none" ]; then
            READY=$(python3 - "$CUSTOM_DOMAIN" <<'PY'
          import socket, sys
          gh = {"185.199.108.153", "185.199.109.153", "185.199.110.153", "185.199.111.153"}
          d = sys.argv[1]
          try:
              apex = set(socket.gethostbyname_ex(d)[2])
          except OSError:
              apex = set()
          try:
              name, aliases, ips = socket.gethostbyname_ex("www." + d)
              www = name.endswith("github.io") or any(a.endswith("github.io") for a in aliases) or (set(ips) and set(ips) <= gh)
          except OSError:
              www = False
          print("yes" if (apex and apex <= gh) else "no", sorted(apex), "www->github" if www else "")
          PY
            )
            echo "DNS check for $CUSTOM_DOMAIN: $READY"
            if [ "${READY%% *}" = "yes" ] || [ "$CUSTOM_DOMAIN_FORCE" = "1" ]; then
              echo "$CUSTOM_DOMAIN" > _site/CNAME
              ORIGIN="https://$CUSTOM_DOMAIN/"
              echo "Custom domain on: $ORIGIN"
            else
              echo "Custom domain waiting for DNS: point $CUSTOM_DOMAIN's A records at 185.199.108.153, .109.153, .110.153 and .111.153 (and www as a CNAME to ${GITHUB_REPOSITORY_OWNER}.github.io)"
            fi
          fi
          node scripts/build_seo.mjs _site "$ORIGIN"

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy site from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published to gh-pages: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"

      # Tell Bing, Yandex and other IndexNow search engines about every page once a day (custom domain only)
      - name: Submit pages to IndexNow
        if: github.event.schedule == '30 11 * * 1-5' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          if [ ! -f _site/CNAME ] || [ ! -f indexnow.json ]; then echo "Custom domain not on yet; skipped."; exit 0; fi
          sleep 60   # let GitHub Pages serve the key file first
          jq -c '.urlList |= .[:10000]' indexnow.json > /tmp/indexnow.json
          curl -sS -m 60 -o /dev/null -w "IndexNow: HTTP %{http_code} for $(jq '.urlList | length' /tmp/indexnow.json) URLs\n" \
            -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" --data @/tmp/indexnow.json || true

      - name: Send alerts (email / Telegram / WhatsApp)
        continue-on-error: true
        env:
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
        run: |
          URL=$(node -e 'global.window = {}; require("./_site/js/config.js"); process.stdout.write((window.SANKHYAS_CONFIG || {}).supabaseUrl || "")')
          if [ -z "$URL" ]; then echo "Accounts are off; no alerts to send."; exit 0; fi
          sleep 75   # let GitHub Pages serve the data just published
          curl -sS -m 140 -X POST "${URL%/}/functions/v1/dispatch-alerts" -H "Content-Type: application/json" \
            ${DISPATCH_SECRET:+-H "x-dispatch-secret: $DISPATCH_SECRET"} -d '{}' || true
          echo
          # welcome emails for new users who confirmed their email but have not signed in since
          if [ -n "$DISPATCH_SECRET" ]; then
            curl -sS -m 60 -X POST "${URL%/}/functions/v1/welcome-email" -H "Content-Type: application/json" -H "x-dispatch-secret: $DISPATCH_SECRET" -d '{}' || true
            echo
          fi
