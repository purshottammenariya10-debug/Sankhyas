name: Probe (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pypdf requests
      - name: Annual reports
        run: python .github/probe/probe2.py ar TCS=https://nsearchives.nseindia.com/annual_reports/AR_29263_TCS_2025_2026_A_17427580_15052026234830.pdf ADANIENT=https://nsearchives.nseindia.com/annual_reports/AR_29299_ADANIENT_2025_2026_A_17942605_29052026223750.pdf RCOM=https://nsearchives.nseindia.com/annual_reports/AR_28972_RCOM_2024_2025_A_1610447_08092025212210.pdf INDIACEM=https://nsearchives.nseindia.com/annual_reports/AR_29876_INDIACEM_2025_2026_A_2407224_17072026210449.pdf
