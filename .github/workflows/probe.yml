name: Probe (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pypdf requests
      - name: SRIT
        run: python .github/probe/rhp.py SRIT
      - name: ORIENTCABL
        run: python .github/probe/rhp.py ORIENTCABL
      - name: MONEYVIEW
        run: python .github/probe/rhp.py MONEYVIEW
