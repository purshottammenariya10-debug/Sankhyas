name: Probe (temporary)
on:
  workflow_dispatch:
jobs:
  pSRIT:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pypdf requests
      - run: python .github/probe/rhp.py SRIT 2>/dev/null
