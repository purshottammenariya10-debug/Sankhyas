name: Probe (temporary)
on:
  workflow_dispatch:
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pypdf requests
      - run: python scripts/ipo_notes.py --ipo .github/probe/ipo.json --max 8 --print 2>&1 | grep -v "^Ignoring wrong\|^Multiple definitions\|^incorrect startxref\|^Invalid\|^Object "
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pypdf requests
      - run: python scripts/ipo_notes.py --ipo .github/probe/ipo.json --skip 8 --max 8 --print 2>&1 | grep -v "^Ignoring wrong\|^Multiple definitions\|^incorrect startxref\|^Invalid\|^Object "
