# Points sankhyas.com at GitHub Pages. Run it from Actions -> "Connect custom domain" -> Run workflow.
# It always reports where the domain's DNS is hosted and what it points at now. Given access, it
# replaces the apex and www records with GitHub Pages ones:
#   GoDaddy DNS:    secrets GODADDY_API_KEY and GODADDY_API_SECRET (developer.godaddy.com/keys, Production)
#   Cloudflare DNS: secret CLOUDFLARE_API_TOKEN (API token, "Edit zone DNS" template)
name: Connect custom domain

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domain to connect
        default: sankhyas.com

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    env:
      DOMAIN: ${{ github.event.inputs.domain || 'sankhyas.com' }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GD_KEY: ${{ secrets.GODADDY_API_KEY }}
      GD_SECRET: ${{ secrets.GODADDY_API_SECRET }}
      PAGES_HOST: ${{ github.repository_owner }}.github.io
    steps:
      - name: Where the DNS is hosted now
        run: |
          echo "== NS";  dig +short NS "$DOMAIN"
          echo "== A";   dig +short A "$DOMAIN"
          echo "== AAAA"; dig +short AAAA "$DOMAIN"
          echo "== www"; dig +short CNAME "www.$DOMAIN"; dig +short A "www.$DOMAIN"
          echo "== registrar"; whois "$DOMAIN" 2>/dev/null | grep -iE "registrar:|registrar url|name server" | head -8 || true
          echo "== HTTP (where the domain goes today)"; curl -sIL -m 20 "http://$DOMAIN" | grep -iE "^(HTTP|location|server)" || true
          echo "== page title"; curl -sL -m 20 "http://$DOMAIN" | grep -io "<title>[^<]*" | head -1 || true

      - name: Set GitHub Pages records on GoDaddy
        if: env.GD_KEY != '' && env.GD_SECRET != ''
        run: |
          set -uo pipefail
          AUTH="Authorization: sso-key $GD_KEY:$GD_SECRET"
          API="https://api.godaddy.com/v1/domains/$DOMAIN"
          echo "== records before"
          curl -sS -H "$AUTH" "$API/records" | jq -r '.[]? | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | "\(.type) \(.name) \(.data)"' || true
          check() { code=$(tail -n1 <<<"$1"); body=$(sed '$d' <<<"$1"); echo "$2: HTTP $code $body"; [ "$code" -lt 300 ] || FAIL=1; }
          FAIL=0
          R=$(curl -sS -w '\n%{http_code}' -X PUT -H "$AUTH" -H "Content-Type: application/json" "$API/records/A/@" \
            -d '[{"data":"185.199.108.153","ttl":600},{"data":"185.199.109.153","ttl":600},{"data":"185.199.110.153","ttl":600},{"data":"185.199.111.153","ttl":600}]')
          check "$R" "A @ -> GitHub Pages"
          # an AAAA record on the apex would still send IPv6 visitors to the old site
          R=$(curl -sS -w '\n%{http_code}' -X DELETE -H "$AUTH" "$API/records/AAAA/@"); echo "AAAA @ removed: HTTP $(tail -n1 <<<"$R")"
          R=$(curl -sS -w '\n%{http_code}' -X PUT -H "$AUTH" -H "Content-Type: application/json" "$API/records/CNAME/www" \
            -d "[{\"data\":\"$PAGES_HOST\",\"ttl\":600}]")
          check "$R" "CNAME www -> $PAGES_HOST"
          echo "== records after"
          curl -sS -H "$AUTH" "$API/records" | jq -r '.[]? | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | "\(.type) \(.name) \(.data)"' || true
          if [ "$FAIL" = 1 ]; then
            echo "GoDaddy refused the change. GoDaddy only opens its DNS API to accounts with 10+ domains or a Domain Pro plan; if the answer above says ACCESS_DENIED, set the records by hand in GoDaddy (My Products -> DNS)."
            exit 1
          fi
          echo "Done. The next site deploy detects the new DNS and switches the site to https://$DOMAIN/."

      - name: Set GitHub Pages records on Cloudflare
        if: env.CF_TOKEN != ''
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          ZONE=$(api "https://api.cloudflare.com/client/v4/zones?name=$DOMAIN" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE" ]; then echo "The token cannot see a Cloudflare zone for $DOMAIN."; exit 1; fi
          # remove existing apex/www A, AAAA and CNAME records
          for NAME in "$DOMAIN" "www.$DOMAIN"; do
            for ID in $(api "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=$NAME&per_page=100" | jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id'); do
              api -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records/$ID" | jq -r '"deleted \(.result.id // .errors)"'
            done
          done
          for IP in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
            api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" \
              -d "{\"type\":\"A\",\"name\":\"$DOMAIN\",\"content\":\"$IP\",\"ttl\":1,\"proxied\":false}" | jq -r '"A \(.result.content // .errors)"'
          done
          api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" \
            -d "{\"type\":\"CNAME\",\"name\":\"www.$DOMAIN\",\"content\":\"$PAGES_HOST\",\"ttl\":1,\"proxied\":false}" | jq -r '"CNAME www \(.result.content // .errors)"'
          echo "Done. The next site deploy detects the new DNS and switches the site to https://$DOMAIN/."
