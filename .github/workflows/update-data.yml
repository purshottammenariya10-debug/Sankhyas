name: Update Yahoo Finance data

on:
  schedule:
    # 11:30 UTC = 5:00 pm IST, after NSE close, Monday to Friday
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space separated NSE symbols (blank = scripts/symbols.txt)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yfinance
        run: pip install yfinance

      - name: Fetch data
        run: python scripts/fetch_yahoo.py ${{ github.event.inputs.symbols }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/yahoo
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update Yahoo Finance data"
            git push
          fi
